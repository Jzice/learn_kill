# 部署 GitHub Pages 试玩站点
# 站点根 index.html = bundled 产物（自包含、无 CDN 依赖，打开即玩）；另存 CDN 版供下载
# 首次使用需在仓库 Settings → Pages → Build and deployment → Source 选择 "GitHub Actions"
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages 部署不并发取消，保证站点始终可用
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 构建站点
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建 bundled 产物（离线自包含，作为站点入口）
        run: npm run build:bundled

      - name: 组装站点目录
        run: node scripts/build-pages.mjs

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: 部署
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4