# 推送 v* 版本标签时自动发布 GitHub Release，并同步镜像到 Gitee Release
# 流程：类型检查 → 构建双模式产物 → 产物校验 → 无头浏览器冒烟（门禁）→ 创建 GitHub Release 并上传 → 同步 Gitee Release（需 secrets.GITEE_TOKEN）
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的标签（如 v1.6.1），留空则用当前分支名'
        required: false
        type: string

permissions:
  contents: write # 创建 Release

# 同一标签的发布串行化，避免并发写 Release
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: 构建并发布
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: TypeScript 严格模式检查
        run: npm run typecheck

      - name: 从源码重新生成题库分片（确保 Release 内题库与 data/questions 一致）
        run: npm run build:banks

      - name: 构建 CDN 与 bundled 双模式产物
        run: npm run build

      - name: 校验产物为自包含单文件
        run: npm run verify:dist

      - name: 题库质量审计
        run: npm run audit:banks

      - name: 安装无头 Chromium（冒烟测试用）
        run: npx playwright install --with-deps chromium

      - name: 单机冒烟测试（发布门禁）
        run: npm run smoke

      - name: 联机冒烟测试（发布门禁）
        run: npm run smoke:net

      - name: 铁索连环·横置机制回归（发布门禁）
        run: npm run smoke:tiesuo

      - name: 准备发布资产（ASCII 文件名，避免 GitHub 重命名为占位名）
        run: node scripts/stage-release.mjs

      - name: 创建 Release 并上传产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # 资产清单形如 "release/xuetangsha.html#中文说明"，gh 会把 # 后内容作为显示名
          mapfile -t ASSETS < release/assets.txt
          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "release/assets.txt 为空，无法发布"; exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -q '^xuetangsha\.bundled\.html$'; then
              echo "Release $TAG 已存在且资产命名正常，覆盖上传"
              gh release upload "$TAG" "${ASSETS[@]}" --clobber
              exit 0
            fi
            echo "Release $TAG 存在但资产命名异常（历史中文名被重命名），删除后重建"
            gh release delete "$TAG" --yes
          fi
          # 上一版本标签用于限定自动生成日志的范围；首个版本没有则留空
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            gh release create "$TAG" "${ASSETS[@]}" --title "学堂杀 $TAG" \
              --generate-notes --notes-start-tag "$PREV_TAG"
          else
            gh release create "$TAG" "${ASSETS[@]}" --title "学堂杀 $TAG" --generate-notes
          fi

      - name: 同步发布到 Gitee Release（镜像）
        # 未配置 GITEE_TOKEN 时自动跳过，不影响 GitHub 发布
        if: ${{ secrets.GITEE_TOKEN != '' }}
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          cd release
          # 复用 stage-release 产出的 banks.zip（缺省兜底再打一次），避免上百个中文名文件逐个上传
          test -f banks.zip || zip -r banks.zip banks >/dev/null
          API="https://gitee.com/api/v5/repos/justice/learn_kill"
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          # 幂等：标签对应的 Release 已存在则先删后建，避免重复附件
          RID=$(curl -sf "${API}/releases/tags/${TAG}?access_token=${GITEE_TOKEN}" | jq -r '.id // empty')
          if [ -n "$RID" ]; then
            curl -sf -X DELETE "${API}/releases/${RID}?access_token=${GITEE_TOKEN}" || true
          fi
          RID=$(curl -sf -X POST "${API}/releases?access_token=${GITEE_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"学堂杀 ${TAG}\",\"target_commitish\":\"main\",\"prerelease\":false,\"body\":\"自动同步自 GitHub Actions\"}" \
            | jq -r '.id')
          echo "Gitee release id = ${RID}"
          for f in xuetangsha.html xuetangsha.bundled.html banks.zip; do
            curl -sf -X POST "${API}/releases/${RID}/attach_files?access_token=${GITEE_TOKEN}" \
              -F "file=@${f}"
            echo "已上传 ${f}"
          done